  <footer id="rodape" class="rodape"></footer>
  <!-- 📲 Instalar no celular (PWA): só aparece no celular e quando o site ainda não está instalado -->
  <div class="pwa-inst"><button id="pwa-inst" type="button" hidden>📲 Instalar no celular</button></div>
  <script>
  (function () {
    var b = document.getElementById("pwa-inst"), ev = null;
    var cel = /Android|iPhone|iPad|iPod/i.test(navigator.userAgent);
    var instalado = (window.matchMedia && matchMedia("(display-mode: standalone)").matches) || navigator.standalone;
    if (!cel || instalado) return;
    var ios = /iPhone|iPad|iPod/i.test(navigator.userAgent);
    window.addEventListener("beforeinstallprompt", function (e) { e.preventDefault(); ev = e; b.hidden = false; });
    if (ios) b.hidden = false;
    b.onclick = function () {
      if (ev) { ev.prompt(); ev = null; b.hidden = true; return; }
      alert(ios ? "No iPhone: toque no botão Compartilhar (o quadrado com a seta para cima, embaixo no Safari) e depois em “Adicionar à Tela de Início”."
                : "No Android: toque nos três pontinhos do navegador e depois em “Instalar app” ou “Adicionar à tela inicial”.");
    };
  })();
  </script>
  
  <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
