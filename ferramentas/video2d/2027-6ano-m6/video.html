/* ================= tempo das cenas ================= */
// Sem o MP3: estimativa pelo número de palavras. Com o MP3: window.DURS = [...] (segundos de cada cena, vindos das pausas da voz).
const est = f => Math.max(4.2, f.split(/\s+/).length / 2.55 + 1.3);
let DUR = CENAS.map((s, i) => (window.DURS && window.DURS[i]) || est(s.fala));
function inicio() { const a = [0]; DUR.forEach(d => a.push(a[a.length - 1] + d)); return a; }
let INI = inicio(), T = INI[INI.length - 1];
window.definirDuracoes = d => { DUR = d; INI = inicio(); T = INI[INI.length - 1]; window.T = T; };

function legenda(txt, k) { // legenda de UMA linha (26/11/2026, pedido do professor): o texto vai em trechos que cabem numa linha,
  // de preferência quebrando na pontuação; as palavras acendem e, quando o trecho acaba, entra o próximo
  const pal = txt.split(" ").filter(Boolean), n = Math.floor(pal.length * cl(k * 1.08)); g.font = `700 28px ${F}`;
  const MAX = 1060, esp = g.measureText(" ").width, wd = pal.map(p => g.measureText(p).width);
  const larg = a => a.reduce((s, i, k2) => s + wd[i] + (k2 ? esp : 0), 0);
  const cortaEm = (idx, re) => { const o = [[]]; idx.forEach((i, k2) => { o[o.length - 1].push(i); if (re.test(pal[i]) && k2 < idx.length - 1) o.push([]); }); return o; };
  const equilibra = idx => { const n2 = Math.ceil(larg(idx) / MAX), alvo = larg(idx) / n2, o = [[]]; let w = 0;   // divide em partes de largura parecida
    idx.forEach(i => { if (o[o.length - 1].length && w + esp + wd[i] > alvo * 1.04 && o.length < n2) { o.push([]); w = 0; } w += (o[o.length - 1].length ? esp : 0) + wd[i]; o[o.length - 1].push(i); }); return o; };
  const junta = partes => { const o = []; partes.forEach(pt => { const u = o[o.length - 1]; if (u && larg(u.concat(pt)) <= MAX) o[o.length - 1] = u.concat(pt); else o.push(pt); }); return o; };
  const tr = []; cortaEm(pal.map((_, i) => i), /[.!?:;…]$/).forEach(fr => {   // 1º frase por frase; 2º nas vírgulas; 3º em partes iguais
    if (larg(fr) <= MAX) return tr.push(fr);
    junta(cortaEm(fr, /,$/).flatMap(pt => larg(pt) <= MAX ? [pt] : equilibra(pt))).forEach(x => tr.push(x)); });
  const linhas = tr.filter(t => t.length), atual = Math.min(n, pal.length - 1), ln = linhas.find(t => t.includes(atual)) || linhas[linhas.length - 1];
  const lh = 40, y0 = H - 22 - lh; g.fillStyle = "rgba(10,16,36,.72)"; rr(70, y0 - 10, W - 140, lh + 18, 14); g.fill();
  const tw = ln.reduce((s, i, k2) => s + wd[i] + (k2 ? esp : 0), 0); let x = (W - tw) / 2;
  ln.forEach(i => { g.fillStyle = i < n ? "#fff" : "rgba(255,255,255,.45)"; g.textAlign = "left"; g.fillText(pal[i], x, y0 + 22); x += wd[i] + esp; });
}
function render(t) {
  g.setTransform(1, 0, 0, 1, 0, 0); g.globalAlpha = 1; g.textBaseline = "alphabetic";
  let i = INI.findIndex((s, k) => t >= s && t < INI[k + 1]); if (i < 0) i = CENAS.length - 1;
  const tl = t - INI[i], D = DUR[i], cena = CENAS[i];
  // as animações foram pensadas no tempo estimado; com a voz real, o tempo da cena estica ou encolhe junto
  const esc = est(cena.fala) / D, tt = tl * esc;
  g.save(); cena.draw(tt, D); g.restore();
  g.setTransform(1, 0, 0, 1, 0, 0); g.globalAlpha = 1; g.textAlign = "left";
  if (cena.chip) chip(cena.chip, 0, tt);
  selo(t);
  if (i > 0 && i < CENAS.length - 1) legenda(cena.legenda || cena.fala, tl / Math.max(.1, D - .9));
  // transição suave
  const tr = cl(1 - tl / .25); if (i > 0 && tr > 0) { g.fillStyle = `rgba(13,22,49,${tr})`; g.fillRect(0, 0, W, H); }
}
window.listaSfx = () => { const o = []; CENAS.forEach((s, i) => (s.sfx || []).forEach(([tt, tipo]) => o.push([INI[i] + tt * DUR[i] / est(s.fala), tipo]))); return o; };
window.render = render; window.T = T; window.CENAS = CENAS;
